
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Compétition E-Football COOP</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏆 Compétition E-Football COOP 🏆</h1>
    <nav></nav>
  </header>
  <main id="content">
    <h2>📅 Journées</h2>
    <ul id="matchdays-list"></ul>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC9i9jx7Wz1RBYx8MziXOdfVtu7Si64njvo",
      authDomain: "competition-foot.firebaseapp.com",
      projectId: "competition-foot",
      storageBucket: "competition-foot.appspot.com",
      messagingSenderId: "731546807160",
      appId: "1:731546807160:web:829b3101ee86d9a83bf68d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;

    function buildNav() {
      const nav = document.querySelector("nav");
      if (nav) {
        nav.innerHTML = \`
          <a href="index.html">Journées</a>
          <a href="classement.html">Classement</a>
          <a href="ballon.html">Ballon d'or</a>
          <a href="buteurs.html">Buteurs</a>
        \`;
      }
    }

    async function buildMatchdays() {
      const list = document.getElementById("matchdays-list");
      if (!list || typeof calendar === "undefined") return;

      const scoreMap = {};
      const querySnapshot = await getDocs(collection(db, "matches"));
      querySnapshot.forEach(docSnap => {
        const data = docSnap.data();
        const hasScore = Object.entries(data).some(([k, v]) =>
          k.startsWith("score_") && v !== "" && v !== null && v !== undefined
        );
        if (hasScore) scoreMap[docSnap.id] = true;
      });

      calendar.forEach((day, i) => {
        const dayEl = document.createElement("li");
        let matchList = "<strong>Journée " + day.day + "</strong><ul>";

        day.matches.forEach((m, idx) => {
          const matchId = \`day\${i}_match\${idx}\`;
          const check = scoreMap[matchId] ? " ✔️" : "";
          matchList += \`<li><a href="match.html?day=\${i}&match=\${idx}">\${m.home} vs \${m.away}</a>\${check}</li>\`;
        });

        matchList += "</ul>";
        dayEl.innerHTML = matchList;
        list.appendChild(dayEl);
      });
    }

    buildNav();
    buildMatchdays();
  </script>
  <script src="calendar.js"></script>
</body>
</html>
