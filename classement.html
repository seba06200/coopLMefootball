  <script>

      // ... ton calendrier inchangé ...
    ];

    // Affichage conditionnel du bouton d'export CSV
    if (new URLSearchParams(window.location.search).get("admin") === "1") {
      const exportBtn = document.getElementById("export-csv");
      exportBtn.style.display = "inline-block";
      exportBtn.addEventListener("click", () => {
        if (typeof exportClassementCSV === 'function') {
          exportClassementCSV(); // Doit être défini dans export.js
        } else {
          alert("Fonction d'export non disponible.");
        }
      });
    }
  </script>

  <script type="module" src="classement.js"></script>
  <script type="module" src="export.js"></script>

  <script>
    const links = document.querySelectorAll("nav a");
    const currentPage = location.pathname.split("/").pop();
    links.forEach(link => {
      if (link.getAttribute("href") === currentPage) {
        link.classList.add("active");
      }
    });
  </script>
