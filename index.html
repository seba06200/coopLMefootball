<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css?version=2.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <header>
    <h1>🏆 Compétition E-Football COOP 🏆</h1>
    <nav>
      <a href="index.html">Journées</a>
      <a href="classement.html">Classement</a>
      <a href="ballon.html">Ballon d'or</a>
      <a href="buteurs.html">Buteurs</a>
    </nav>
  </header>

  <main id="content">
    <h2>📅 Journées 📅</h2>
    <ul id="matchdays-list"></ul>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const calendar = [
      { day: 1, matches: [ { home: "Les Charognards", away: "Les BrozArtiste" }, { home: "Lyonissa", away: "Crazy Dogs Bikers" }, { home: "FC District", away: "PastaChorizo FC" }, { home: "Rocher phocéen", away: "KFC" } ] },
      { day: 2, matches: [ { home: "Les Charognards", away: "Lyonissa" }, { home: "Les BrozArtiste", away: "Crazy Dogs Bikers" }, { home: "Rocher phocéen", away: "FC District" }, { home: "PastaChorizo FC", away: "KFC" } ] },
      { day: 3, matches: [ { home: "Les Charognards", away: "Crazy Dogs Bikers" }, { home: "Lyonissa", away: "Les BrozArtiste" }, { home: "KFC", away: "FC District" }, { home: "Rocher phocéen", away: "PastaChorizo FC" } ] },
      { day: 4, matches: [ { home: "Les Charognards", away: "FC District" }, { home: "Crazy Dogs Bikers", away: "Rocher phocéen" }, { home: "Lyonissa", away: "KFC" }, { home: "Les BrozArtiste", away: "PastaChorizo FC" } ] },
      { day: 5, matches: [ { home: "Les Charognards", away: "PastaChorizo FC" }, { home: "FC District", away: "Crazy Dogs Bikers" }, { home: "Lyonissa", away: "Rocher phocéen" }, { home: "Les BrozArtiste", away: "KFC" } ] },
      { day: 6, matches: [ { home: "Les Charognards", away: "Rocher phocéen" }, { home: "PastaChorizo FC", away: "Lyonissa" }, { home: "FC District", away: "Les BrozArtiste" }, { home: "Crazy Dogs Bikers", away: "KFC" } ] },
      { day: 7, matches: [ { home: "Les Charognards", away: "KFC" }, { home: "Rocher phocéen", away: "Les BrozArtiste" }, { home: "PastaChorizo FC", away: "Crazy Dogs Bikers" }, { home: "Lyonissa", away: "FC District" } ] },
      { day: 8, matches: [ { home: "Les BrozArtiste", away: "Les Charognards" }, { home: "Crazy Dogs Bikers", away: "Lyonissa" }, { home: "PastaChorizo FC", away: "FC District" }, { home: "KFC", away: "Rocher phocéen" } ] },
      { day: 9, matches: [ { home: "Lyonissa", away: "Les Charognards" }, { home: "Crazy Dogs Bikers", away: "Les BrozArtiste" }, { home: "FC District", away: "Rocher phocéen" }, { home: "KFC", away: "PastaChorizo FC" } ] },
      { day: 10, matches: [ { home: "Crazy Dogs Bikers", away: "Les Charognards" }, { home: "Les BrozArtiste", away: "Lyonissa" }, { home: "FC District", away: "KFC" }, { home: "PastaChorizo FC", away: "Rocher phocéen" } ] },
      { day: 11, matches: [ { home: "FC District", away: "Les Charognards" }, { home: "Rocher phocéen", away: "Crazy Dogs Bikers" }, { home: "KFC", away: "Lyonissa" }, { home: "PastaChorizo FC", away: "Les BrozArtiste" } ] },
      { day: 12, matches: [ { home: "PastaChorizo FC", away: "Les Charognards" }, { home: "Crazy Dogs Bikers", away: "FC District" }, { home: "Rocher phocéen", away: "Lyonissa" }, { home: "KFC", away: "Les BrozArtiste" } ] },
      { day: 13, matches: [ { home: "Rocher phocéen", away: "Les Charognards" }, { home: "KFC", away: "Crazy Dogs Bikers" }, { home: "Les BrozArtiste", away: "FC District" }, { home: "Lyonissa", away: "PastaChorizo FC" } ] },
      { day: 14, matches: [ { home: "KFC", away: "Les Charognards" }, { home: "Les BrozArtiste", away: "Rocher phocéen" }, { home: "Crazy Dogs Bikers", away: "PastaChorizo FC" }, { home: "FC District", away: "Lyonissa" } ] }
    ];

    const app = initializeApp({
      apiKey: "AIzaSyC9i9jx7Wz1RBYx8MziXOdfVtu7Si64njvo",
      authDomain: "competition-foot.firebaseapp.com",
      projectId: "competition-foot",
      storageBucket: "competition-foot.appspot.com",
      messagingSenderId: "731546807160",
      appId: "1:731546807160:web:829b3101ee86d9a83bf68d"
    });

    const db = getFirestore(app);

    async function buildMatchdays() {
      const list = document.getElementById("matchdays-list");
      const scoreMap = {};
      const querySnapshot = await getDocs(collection(db, "matches"));
      querySnapshot.forEach(docSnap => {
        const data = docSnap.data();
        const hasScore = Object.entries(data).some(([k, v]) =>
          k.startsWith("score_") && !isNaN(parseInt(v)) && parseInt(v) >= 0
        );
        if (hasScore) scoreMap[docSnap.id] = true;
      });

      calendar.forEach((day, i) => {
        const li = document.createElement("li");
        li.innerHTML = "<strong style='font-size:18px'>Journée " + day.day + "</strong><ul>" +
          day.matches.map((m, idx) => {
            const id = `day${i}_match${idx}`;
            const check = scoreMap[id] ? " ✔️" : "";
            return `<li><a href="match.html?day=${i}&match=${idx}">${m.home} vs ${m.away}</a>${check}</li>`;
          }).join("") + "</ul>";
        list.appendChild(li);
      });
    }

    buildMatchdays();
  </script>

  <script src="export_journees.js"></script>
  <script>
    // Activation conditionnelle du bouton d'export
    if (new URLSearchParams(window.location.search).get("admin") === "1") {
      const exportBtn = document.getElementById("export-btn");
      exportBtn.style.display = "block";
      exportBtn.addEventListener("click", () => {
        if (typeof exportAllMatchdays === "function") {
          exportAllMatchdays();
        } else {
          alert("Fonction d'export non disponible.");
        }
      });
    }

    // Surlignage du lien actif dans la nav
    const links = document.querySelectorAll("nav a");
    const currentPage = location.pathname.split("/").pop();
    links.forEach(link => {
      if (link.getAttribute("href") === currentPage) {
        link.classList.add("active");
      }
    });
  </script>
</body>
</html>
